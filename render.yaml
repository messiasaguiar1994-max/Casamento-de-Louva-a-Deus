# Servidor do Casamento dos Louva-a-Deus no Render (plano gratis)
services:
  - type: web
    name: tiktok-casamento
    runtime: node
    plan: free
    rootDir: servidor
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /status
    envVars:
      - key: EULER_API_KEY
        sync: false
